[package]
name = "monocode-phone-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

# Resolve independently of the desktop/Tauri builds. No GUI is linked.
[workspace]

[dependencies]
monocode-core = { path = "../monocode-core" }
monocode-mobile-link = { path = "../mobile-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2.12"
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
# Upstream core includes keyring even though this binary uses private files.
# Build its D-Bus dependency without requiring system-wide dbus-devel.
libdbus-sys = { version = "0.2", features = ["vendored"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "signal"] }

[dev-dependencies]
base64 = "0.22"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
